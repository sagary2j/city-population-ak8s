name: CI/CD - City Population API

# ---------------------------------------------------------------------------
# This pipeline follows a GitOps deployment model: it never talks to the
# cluster directly with `kubectl apply`. Instead, once an image is built,
# scanned, and pushed to ACR, the pipeline updates the image tag in
# helm/values.yaml and commits that change back to the repository.
# ArgoCD (argocd/application.yaml), which continuously watches this repo,
# then detects the change and syncs it to AKS. This keeps the cluster state
# reconciled against Git as the single source of truth, and means the
# GitHub Actions identity never needs cluster-admin / kubectl-apply rights.
# ---------------------------------------------------------------------------

on:
  push:
    branches: 
      - main
      - feature/build-deploy-acr
    paths:
      - "app/**"
      - "Dockerfile"
      - "helm/**"
      - ".github/workflows/ci-cd.yaml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "helm/**"

permissions:
  id-token: write     # required for Azure OIDC login (no stored secrets)
  contents: write      # required to commit the GitOps image-tag bump
  pull-requests: write  # required to post scan-summary PR comments
  security-events: write # required to upload SARIF (Trivy, Bandit) to code scanning

env:
  REGISTRY_REPOSITORY: city-population-api
  PYTHON_VERSION: "3.11"

jobs:
  # =========================================================================
  # 1. Lint, unit test, SAST, secret scan, Dockerfile lint
  # =========================================================================
  test-and-scan:
    name: Lint, Test & SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history needed for gitleaks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: app
        run: ruff check . --output-format=github

      - name: Unit tests (pytest)
        working-directory: app
        run: pytest tests/ -v --junitxml=pytest-results.xml

      - name: Ensure pytest report exists
        if: always()
        run: |
          if [ ! -f app/pytest-results.xml ]; then
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?><testsuites></testsuites>' > app/pytest-results.xml
          fi

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: pytest results
          path: app/pytest-results.xml
          reporter: java-junit

      - name: SAST (bandit)
        run: |
          bandit -r app/main.py -f json -o app/bandit-results.json || true
          python3 - <<'PY'
          import json
          from pathlib import Path

          src = Path("app/bandit-results.json")
          results = []
          if src.exists():
              try:
                  payload = json.loads(src.read_text())
                  for item in payload.get("results", []):
                      sev = (item.get("issue_severity") or "LOW").upper()
                      level = "error" if sev == "HIGH" else ("warning" if sev == "MEDIUM" else "note")
                      results.append(
                          {
                              "ruleId": item.get("test_id", "BANDIT"),
                              "level": level,
                              "message": {"text": item.get("issue_text", "Bandit finding")},
                              "locations": [
                                  {
                                      "physicalLocation": {
                                          "artifactLocation": {"uri": item.get("filename", "unknown")},
                                          "region": {"startLine": item.get("line_number", 1)},
                                      }
                                  }
                              ],
                          }
                      )
              except Exception:
                  results = []

          sarif = {
              "version": "2.1.0",
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "runs": [
                  {
                      "tool": {
                          "driver": {
                              "name": "Bandit",
                              "informationUri": "https://bandit.readthedocs.io/",
                              "rules": [],
                          }
                      },
                      "results": results,
                  }
              ],
          }
          Path("app/bandit-results.sarif").write_text(json.dumps(sarif))
          PY

      - name: Ensure Bandit SARIF exists
        if: always()
        run: |
          if [ ! -f app/bandit-results.sarif ]; then
            printf '%s\n' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Bandit","informationUri":"https://bandit.readthedocs.io/","rules":[]}},"results":[]}]}' > app/bandit-results.sarif
          fi

      - name: Upload bandit SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: app/bandit-results.sarif
          category: bandit

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # =========================================================================
  # 2. IaC scanning (Terraform + Helm/Kubernetes manifests)
  # =========================================================================
  iac-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkov (Terraform, Dockerfile, Kubernetes/Helm)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,dockerfile,kubernetes
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true # report findings without blocking the pipeline; tighten for prod

      - name: Ensure Checkov SARIF exists
        if: always()
        run: |
          if [ -d checkov-results.sarif ]; then
            for f in checkov-results.sarif/*.sarif; do
              if [ -f "$f" ]; then
                cp "$f" checkov-results-upload.sarif
                break
              fi
            done
          fi
          if [ ! -f checkov-results-upload.sarif ] && [ -f checkov-results.sarif ]; then
            cp checkov-results.sarif checkov-results-upload.sarif
          fi
          if [ ! -f checkov-results-upload.sarif ]; then
            printf '%s\n' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Checkov","informationUri":"https://www.checkov.io/","rules":[]}},"results":[]}]}' > checkov-results.sarif
            cp checkov-results.sarif checkov-results-upload.sarif
          fi

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov-results-upload.sarif
          category: checkov

      - name: tfsec (Terraform-specific deep scan)
        run: |
          curl -sSfL https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64 -o /usr/local/bin/tfsec
          chmod +x /usr/local/bin/tfsec
          tfsec terraform --format sarif --out tfsec-results || true

      - name: Ensure tfsec SARIF exists
        if: always()
        run: |
          if [ ! -f tfsec-results.sarif ]; then
            printf '%s\n' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"tfsec","informationUri":"https://aquasecurity.github.io/tfsec/","rules":[]}},"results":[]}]}' > tfsec-results.sarif
          fi

      - name: Upload tfsec SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: tfsec-results.sarif
          category: tfsec

  # =========================================================================
  # 3. Build image, scan it, push to ACR (only after tests/scans pass)
  # =========================================================================
  build-and-push:
    name: Build, Scan & Push Image
    runs-on: ubuntu-latest
    needs: [test-and-scan, iac-scan]
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'main' && 'dev' || '' }}
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-12)
          IMAGE_TAG="${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${{ vars.ACR_LOGIN_SERVER }}/${{ env.REGISTRY_REPOSITORY }}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC, no stored secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not yet pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image_ref }}
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "1" # fail the build on CRITICAL/HIGH findings
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # - name: Push image to ACR
