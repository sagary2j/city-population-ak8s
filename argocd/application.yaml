apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: city-population
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: city-population
spec:
  project: city-population

  source:
    repoURL: https://github.com/sagary2j/city-population-ak8s.git
    targetRevision: main
    path: helm
    helm:
      valueFiles:
        - values.yaml
      releaseName: city-population
      parameters:
        - name: elasticsearch.initContainers.fixVmMaxMapCount.enabled
          value: "false"
        - name: elasticsearch.initContainers.fixDataPermissions.enabled
          value: "false"

  destination:
    server: https://kubernetes.default.svc
    namespace: city-population

  syncPolicy:
    automated:
      prune: true       # remove resources that are deleted from Git
      selfHeal: true    # revert manual `kubectl edit` drift back to Git state
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
        
  revisionHistoryLimit: 10
