apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: city-population
  namespace: argocd
  finalizers:
    # Ensures `argocd app delete` also removes the Kubernetes resources it
    # created, rather than orphaning them.
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: city-population
spec:
  project: city-population

  source:
    repoURL: https://github.com/sagary2j/city-population-ak8s.git
    targetRevision: main
    path: helm
    helm:
      valueFiles:
        - values.yaml
      # releaseName keeps resource names stable across re-creations of the Application.
      releaseName: city-population
      parameters:
        # AKS's built-in Azure Policy (Gatekeeper) blocks privileged and
        # root-running containers (k8sazurev2noprivilege,
        # k8sazurev3allowedusersgroups), so these init containers can never
        # run here. They're also unnecessary on this cluster: the node image
        # already ships vm.max_map_count=1048576 (well above ES's 262144
        # requirement), and the Azure Disk CSI driver applies `fsGroup`
        # ownership on mount, so the data dir is already writable by the ES
        # user without an explicit chown step.
        - name: elasticsearch.initContainers.fixVmMaxMapCount.enabled
          value: "false"
        - name: elasticsearch.initContainers.fixDataPermissions.enabled
          value: "false"

  destination:
    server: https://kubernetes.default.svc
    namespace: city-population

  syncPolicy:
    automated:
      prune: true    # remove resources that are deleted from Git
      selfHeal: true    # revert manual `kubectl edit` drift back to Git state
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  # The image tag in helm/values.yaml is the only field the CI pipeline
  # mutates (see .github/workflows/ci-cd.yaml's update-manifests job); ArgoCD
  # detects that commit via its normal polling/webhook and reconciles.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas # let the HPA (if enabled) own replica count without fighting ArgoCD

  revisionHistoryLimit: 10
