apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "city-population.fullname" . }}-api
  namespace: {{ include "city-population.namespace" . }}
  labels:
    {{- include "city-population.labels" . | nindent 4 }}
    {{- include "city-population.app.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      {{- include "city-population.app.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "city-population.app.selectorLabels" . | nindent 8 }}
      annotations:
        {{- toYaml .Values.app.podAnnotations | nindent 8 }}
        checksum/values: {{ toYaml .Values | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.app.podSecurityContext | nindent 8 }}
      # Spread replicas across nodes to survive single-node failure.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "city-population.app.selectorLabels" . | nindent 20 }}
      containers:
        - name: api
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.app.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ES_HOST
              value: {{ include "city-population.esHost" . | quote }}
            - name: ES_INDEX
              value: {{ .Values.app.env.ES_INDEX | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.app.env.LOG_LEVEL | quote }}
            - name: ES_STARTUP_MAX_RETRIES
              value: {{ .Values.app.env.ES_STARTUP_MAX_RETRIES | quote }}
            - name: ES_STARTUP_RETRY_DELAY_SECONDS
              value: {{ .Values.app.env.ES_STARTUP_RETRY_DELAY_SECONDS | quote }}
            - name: ES_VERIFY_CERTS
              value: {{ .Values.app.env.ES_VERIFY_CERTS | quote }}
            - name: APP_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: ES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "city-population.fullname" . }}-es-credentials
                  key: username
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "city-population.fullname" . }}-es-credentials
                  key: password
          startupProbe:
            httpGet:
              path: {{ .Values.app.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.app.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.app.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.app.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.app.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.app.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.app.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.app.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.app.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.app.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.app.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.app.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem needs a writable /tmp for uvicorn/pydantic
        # scratch space.
        - name: tmp
          emptyDir: {}
---
{{- if .Values.app.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "city-population.fullname" . }}-api-pdb
  namespace: {{ include "city-population.namespace" . }}
  labels:
    {{- include "city-population.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.app.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "city-population.app.selectorLabels" . | nindent 6 }}
{{- end }}
---
{{- if .Values.app.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "city-population.fullname" . }}-api-hpa
  namespace: {{ include "city-population.namespace" . }}
  labels:
    {{- include "city-population.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "city-population.fullname" . }}-api
  minReplicas: {{ .Values.app.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.app.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.app.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
