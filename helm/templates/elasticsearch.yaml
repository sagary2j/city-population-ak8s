{{- if .Values.elasticsearch.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "city-population.fullname" . }}-elasticsearch
  labels:
    {{- include "city-population.labels" . | nindent 4 }}
    {{- include "city-population.es.selectorLabels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "city-population.es.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.elasticsearch.service.port }}
      targetPort: http
    - name: transport
      port: {{ .Values.elasticsearch.service.transportPort }}
      targetPort: transport
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "city-population.fullname" . }}-elasticsearch
  labels:
    {{- include "city-population.labels" . | nindent 4 }}
    {{- include "city-population.es.selectorLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "city-population.fullname" . }}-elasticsearch
  replicas: {{ .Values.elasticsearch.replicaCount }}
  selector:
    matchLabels:
      {{- include "city-population.es.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "city-population.es.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.elasticsearch.podSecurityContext | nindent 8 }}
      {{- $fixVmMaxMapCountEnabled := (.Values.elasticsearch.initContainers.fixVmMaxMapCount.enabled | default true) }}
      {{- $fixDataPermissionsEnabled := (.Values.elasticsearch.initContainers.fixDataPermissions.enabled | default true) }}
      {{- if or $fixVmMaxMapCountEnabled $fixDataPermissionsEnabled }}
      # sysctl / permission prep for Elasticsearch. In clusters enforcing a
      # strict non-root policy, disable these init containers via values.
      initContainers:
      {{- if $fixVmMaxMapCountEnabled }}
        - name: fix-vm-max-map-count
          image: busybox:1.36
          securityContext:
            privileged: true
            runAsUser: 0
          command:
            - sh
            - -c
            - sysctl -w vm.max_map_count=262144 || true
      {{- end }}
      {{- if $fixDataPermissionsEnabled }}
        - name: fix-data-permissions
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - chown -R {{ .Values.elasticsearch.podSecurityContext.runAsUser }}:{{ .Values.elasticsearch.podSecurityContext.fsGroup }} /usr/share/elasticsearch/data
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
      {{- end }}
      {{- end }}
      containers:
        - name: elasticsearch
          image: "{{ .Values.elasticsearch.image.repository }}:{{ .Values.elasticsearch.image.tag }}"
          imagePullPolicy: {{ .Values.elasticsearch.image.pullPolicy }}
          env:
            - name: cluster.name
              value: {{ .Values.elasticsearch.clusterName | quote }}
            - name: discovery.type
              value: {{ .Values.elasticsearch.discoveryType | quote }}
            - name: xpack.security.enabled
              value: {{ .Values.elasticsearch.xpackSecurityEnabled | quote }}
            - name: ES_JAVA_OPTS
              value: {{ .Values.elasticsearch.javaOpts | quote }}
            - name: bootstrap.memory_lock
              value: "false"
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          resources:
            {{- toYaml .Values.elasticsearch.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
  {{- if not .Values.elasticsearch.persistence.enabled }}
      volumes:
        - name: es-data
          emptyDir: {}
  {{- else }}
  volumeClaimTemplates:
    - metadata:
        name: es-data
      spec:
        accessModes:
          {{- toYaml .Values.elasticsearch.persistence.accessModes | nindent 10 }}
        {{- if ne .Values.elasticsearch.persistence.storageClassName "default" }}
        storageClassName: {{ .Values.elasticsearch.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.elasticsearch.persistence.size }}
  {{- end }}
{{- if .Values.elasticsearch.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "city-population.fullname" . }}-elasticsearch-pdb
  labels:
    {{- include "city-population.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.elasticsearch.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "city-population.es.selectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}
