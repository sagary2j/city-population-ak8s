{{- if .Values.elasticsearch.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "city-population.fullname" . }}-elasticsearch-isolation
  namespace: {{ include "city-population.namespace" . }}
  labels:
    {{- include "city-population.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "city-population.es.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "city-population.app.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9200
    # Allow ES nodes to talk to each other over the transport port (needed
    # once this is scaled beyond a single node in production).
    - from:
        - podSelector:
            matchLabels:
              {{- include "city-population.es.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9300
{{- end }}
