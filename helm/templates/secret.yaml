{{/*
Dev/local convenience Secret. In production, replace this with an
externally-managed secret synced from Key Vault (via the Secrets Store CSI
Driver) or Vault instead - Helm shouldn't be the source of truth for real
credentials.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "city-population.fullname" . }}-es-credentials
  namespace: {{ include "city-population.namespace" . }}
  labels:
    {{- include "city-population.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.app.elasticsearchAuth.username | b64enc | quote }}
  password: {{ .Values.app.elasticsearchAuth.password | b64enc | quote }}
