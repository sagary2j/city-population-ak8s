# Default values for the city-population chart.
# This file separates the application layer from the stateful Elasticsearch
# layer so each can be scaled/tuned independently.

nameOverride: ""
fullnameOverride: ""
# Dedicated namespace for every resource this chart renders (Deployment,
# StatefulSet, Services, Secret, NetworkPolicy, etc.) -- keeps the app and
# its Elasticsearch data layer isolated from `default` and from other
# workloads in the cluster, and matches the NetworkPolicy in
# templates/networkpolicy.yaml which only allows pod-to-pod traffic within
# this namespace. Set to "" to fall back to whatever namespace `helm
# install -n <ns>` / the current kube context provides instead.
#
# Note: ArgoCD's Application (argocd/application.yaml) pins its own
# `destination.namespace: city-population` independently of this value, so
# GitOps-driven deploys are unaffected either way -- this mainly matters for
# manual `helm install`/`helm upgrade` (see Makefile / README.md).
namespaceOverride: "city-population"
createNamespace: true
# ---------------------------------------------------------------------------
# Application (FastAPI) layer
# ---------------------------------------------------------------------------
app:
  replicaCount: 2
  image:
    repository: citypopdevacrmhupn.azurecr.io/city-population-api
    tag: "1351f8f67922"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  env:
    LOG_LEVEL: "INFO"
    ES_INDEX: "cities"
    ES_STARTUP_MAX_RETRIES: "30"
    ES_STARTUP_RETRY_DELAY_SECONDS: "2"
    ES_VERIFY_CERTS: "false"
  # Credentials for Elasticsearch (leave blank for the dev/single-node ES
  # deployed by this chart, which runs with security disabled). In
  # production, source these from a Secret backed by Azure Key Vault /
  # HashiCorp Vault instead of plaintext values -- see README Part D.
  elasticsearchAuth:
    username: ""
    password: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  probes:
    # Gates when liveness/readiness begin: Kubernetes won't run those probes
    # until this one succeeds, so a slow Elasticsearch (up to
    # ES_STARTUP_MAX_RETRIES * ES_STARTUP_RETRY_DELAY_SECONDS, default 60s)
    # never causes a premature liveness-triggered restart.
    startup:
      path: /health/startup
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 30 # 5s * 30 = 150s budget, comfortably above the app's own ~60s ES retry budget
    liveness:
      path: /health/live
      initialDelaySeconds: 0
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /health/ready
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
  # Production secret sourcing via the AKS-managed Secrets Store CSI Driver
  # + Azure Key Vault (provisioned in terraform/key_vault.tf), instead of the
  # plaintext helm/templates/secret.yaml used for local/dev. Disabled by
  # default; enable once the CSI driver add-on and workload identity are
  # set up, then point elasticsearchAuth at the CSI-mounted files instead.
  keyVault:
    enabled: false
    name: "" # terraform output: key_vault_name
    tenantId: "" # az account show --query tenantId -o tsv
    userAssignedIdentityClientId: "" # AKS key_vault_secrets_provider identity client ID
    secrets:
      - objectName: es-username
        secretName: es-username
      - objectName: es-password
        secretName: es-password
# ---------------------------------------------------------------------------
# Elasticsearch (stateful data) layer
# NOTE: this chart ships a lightweight single-node StatefulSet suitable for
# local development and the take-home evaluation. For production sizing and
# HA topology (dedicated master/data/ingest roles, 3+ AZs, snapshots) see
# README.md Part D: Production Scaling Architecture.
# ---------------------------------------------------------------------------
elasticsearch:
  enabled: true
  replicaCount: 1
  image:
    repository: docker.elastic.co/elasticsearch/elasticsearch
    tag: "8.17.0"
    pullPolicy: IfNotPresent
  clusterName: "city-population-es"
  discoveryType: "single-node"
  xpackSecurityEnabled: false
  service:
    port: 9200
    transportPort: 9300
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  javaOpts: "-Xms512m -Xmx512m"
  # Some local clusters enforce strict non-root policies that block privileged
  # or root init containers. In those environments, disable these and set
  # vm.max_map_count on the host separately if needed.
  initContainers:
    fixVmMaxMapCount:
      enabled: true
    fixDataPermissions:
      enabled: true
  persistence:
    enabled: true
    storageClassName: "default"
    size: 5Gi
    accessModes:
      - ReadWriteOnce
  podSecurityContext:
    fsGroup: 1000
    runAsUser: 1000
    runAsNonRoot: true
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
imagePullSecrets: []
